name: Release

on:
    push:
        branches: [master]
        paths:
            - package.json

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org
            - run: npm ci
            - run: npm test
            - name: Check whether the version is new
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if npm view "d3-3d@$VERSION" version >/dev/null 2>&1; then
                      echo "new=false" >> "$GITHUB_OUTPUT"
                      echo "d3-3d@$VERSION is already on npm, skipping the publish."
                  else
                      echo "new=true" >> "$GITHUB_OUTPUT"
                      echo "Publishing d3-3d@$VERSION."
                  fi
            - name: Publish
              if: steps.version.outputs.new == 'true'
              # npm publish runs prepack, which typechecks and builds.
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Tag the release
              if: steps.version.outputs.new == 'true'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag "v$VERSION"
                  git push origin "v$VERSION"
