name: CI

on:
    - pull_request
    - push

jobs:
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run typecheck

    template:
        name: Library Template
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow resolves the template rules against the changed
                  # files, so the history has to be there.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - name: Check the library template
              run: npm run lint
              env:
                  # Report the findings as inline annotations on the pull
                  # request instead of a wall of text in the log.
                  FALLOW_FORMAT: github-annotations

    test:
        name: Test (Node ${{matrix.node}})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{matrix.node}}
                  cache: 'npm'
            - run: npm ci
            - run: npm test
            - name: Upload coverage
              uses: codecov/codecov-action@v7
              if: matrix.node == 22
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [typecheck, test, template]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build
                  path: build/
