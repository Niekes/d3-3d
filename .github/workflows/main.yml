name: CI

on:
    - pull_request
    - push

jobs:
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run typecheck

    template:
        name: Library Template
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow resolves the template rules against the changed
                  # files, so the history has to be there.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - name: Check the library template
              run: npm run lint
              env:
                  # Report the findings as inline annotations on the pull
                  # request instead of a wall of text in the log.
                  FALLOW_FORMAT: github-annotations

    test:
        name: Test (Node ${{matrix.node}})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{matrix.node}}
                  cache: 'npm'
            - run: npm ci
            # Fails when the coverage drops below the thresholds in vite.config.ts.
            - run: npm run coverage

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [typecheck, test, template]
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build
                  path: build/
            - name: Update the health and coverage badges
              if: github.ref == 'refs/heads/master' && github.event_name == 'push'
              run: |
                  npx fallow health --format badge > .github/badges/health.svg
                  npm run coverage
                  # A shields.io endpoint badge, read by the README.
                  node -e "const p = require('./coverage/coverage-summary.json').total.lines.pct; console.log(JSON.stringify({ schemaVersion: 1, label: 'coverage', message: p + '%', color: p >= 90 ? 'brightgreen' : p >= 75 ? 'yellow' : 'red' }))" > .github/badges/coverage.json
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/health.svg .github/badges/coverage.json
                  git diff --quiet --cached || git commit -m "chore: update the health and coverage badges [skip ci]"
                  git push
