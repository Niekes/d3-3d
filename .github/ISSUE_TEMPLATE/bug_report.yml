name: Bug report
description: Something in d3-3d does not behave the way it should
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report this. A reproduction is worth more
              than a description — a CodePen or a minimal snippet is ideal.

    - type: textarea
      id: what-happened
      attributes:
          label: What happened
          description: What did you expect, and what happened instead?
          placeholder: The rendered polygon is inverted when I rotate by more than 90 degrees.
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction
          description: A CodePen, a gist, or a minimal snippet that shows the problem.
          placeholder: https://codepen.io/...
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: d3-3d version
          placeholder: 2.1.0
      validations:
          required: true

    - type: input
      id: d3-version
      attributes:
          label: d3 version
          placeholder: 7.9.0

    - type: dropdown
      id: environment
      attributes:
          label: Environment
          options:
              - Browser
              - Node.js
              - Deno
              - Bun
              - Other
      validations:
          required: true

    - type: textarea
      id: anything-else
      attributes:
          label: Anything else
          description: Console output, screenshots, or a link to a related issue.
