name: Feature request
description: Suggest a new shape, an option, or a change to the API
labels: [enhancement]
body:
    - type: markdown
      attributes:
          value: |
              Tell me what you are trying to build. That makes it much easier to
              design an API that fits.

    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: Describe the problem you are trying to solve, not only the solution you have in mind.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed API
          description: If you have an API in mind, sketch it out.
          placeholder: |
              const renderer = triangles3D()
                  .depth(0.5);

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives you considered

    - type: checkboxes
      id: contribution
      attributes:
          label: Contribution
          options:
              - label: I am willing to implement this myself and open a pull request.
